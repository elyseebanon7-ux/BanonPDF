name: BanonPDF Security & Build Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Secret Scanning & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript Code
        run: npx tsc --noEmit

      - name: Run Dependency Audit
        run: npm audit --audit-level=high || true

      - name: Verify Build Output
        run: npm run build
